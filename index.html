else{const a=E('button','b','✔ Accepter'),n=E('button','b2','✖ Refuser');a.onclick=async()=>{if((await get(R(gp+'/s'))).val()=='wait')await set(R(gp+'/s'),'on');op()};n.onclick=async()=>{if((await get(R(gp+'/s'))).val()=='wait')await set(R(gp+'/s'),'no');n.textContent='Refusée'};c.append(a,n)}d.append(c)}
const cn={};for(const u in v.re||{})cn[v.re[u]]=(cn[v.re[u]]||0)+1;if(Object.keys(cn).length){const q=E('div','rx');for(const e in cn)q.append(E('span',0,e+' '+cn[e]));d.append(q)}
d.append(E('div','t',hm(v.t)+(v.ed?' · modifié':'')));if(cur)localStorage['s'+cur.path]=v.t;
d.onclick=()=>{const o=d.querySelector('.ab');if(o)return o.remove();const ab=E('div','ab');ab.onclick=e=>e.stopPropagation();
['👍','❤️','😂','😮','😢'].forEach(e=>{const b=E('button',0,e);b.onclick=()=>set(R(`${cur.path}/${k}/re/${me.uid}`),v.re?.[me.uid]==e?null:e);ab.append(b)});
if(v.x&&v.u==me.uid){const e=E('button',0,'✏️');e.onclick=()=>{const x=prompt('Modifier le message',v.x);if(x&&x.trim()&&x.trim()!=v.x)update(R(`${cur.path}/${k}`),{x:x.trim(),ed:1})};ab.append(e)}
if(v.u==me.uid||mr=='a'||mr=='o'){const x=E('button',0,'🗑️');x.onclick=()=>set(R(`${cur.path}/${k}`),null);ab.append(x)}d.append(ab)};
$('#ms').append(d)}
function openChat(o){cur=o;gid=o.gid;delete UN[o.path];dots();G=null;$('#ch').hidden=false;$('#ms').replaceChildren();$('#ms').style.background='';$('#cn').textContent=o.title;$('#gb').hidden=true;$('#gmb').hidden=!!gid;$('#gq').hidden=true;
const go=()=>CU.push(onValue(query(R(o.path),limitToLast(150)),s=>{const b=$('#ms'),st=b.scrollHeight-b.scrollTop-b.clientHeight<90;b.replaceChildren();LD='';s.forEach(c=>{add(c.val(),c.key)});if(st)b.scrollTop=1e9}));
if(gid){let f=1;CU.push(onValue(R('groups/'+gid),s=>{G=s.val();if(!G)return closeChat();$('#cn').replaceChildren(gpic(G.pic,26),' '+G.name);$('#ms').style.background=G.bg?.startsWith('data:')?`url(${G.bg}) center/cover`:G.bg;const r=G.members?.[me.uid];$('#gb').hidden=!r;if(!$('#st').hidden)openSet();if(f){f=0;go()}},()=>closeChat()))}else go()}
function closeChat(){CU.forEach(f=>f());CU=[];$('#ch').hidden=true;$('#st').hidden=true;G=gid=null}
$('#bk').onclick=closeChat;$('#sx').onclick=()=>$('#st').hidden=true;$('#gb').onclick=openSet;$('#gx').onclick=()=>{$('#gv').hidden=true;GU.forEach(f=>f());GU=[]};$('#ph').onclick=()=>$('#pf').click();$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)push(R(cur.path),{u:me.uid,n:me.name,t:Date.now(),i:await shrink(f,800,.6)})};
$('#sf').onsubmit=e=>{e.preventDefault();const x=$('#si').value.trim();if(!x)return;$('#si').value='';push(R(cur.path),{u:me.uid,n:me.name,t:Date.now(),x})};

function openSet(){const my=G.members[me.uid],ad=my=='a',b=$('#sb'),gp='groups/'+gid;b.replaceChildren();$('#st').hidden=false;
const n=E('input'),p=E('input'),sv=E('button','b','Enregistrer'),cs=E('div','sw'),gc=E('button','b','Générer un code (1 utilisation)'),cd=E('div','cd');
n.value=G.name;p.value=G.pic;p.maxLength=4;p.placeholder='Emoji de la photo de groupe';
sv.onclick=()=>update(R(gp),{name:n.value.trim()||G.name,pic:p.value||'💬'});
['#000000','#1a0006','#001a0e','#00101f','#1a1200'].forEach(c=>{const s=E('button','sq');s.style.background=c;s.onclick=()=>set(R(gp+'/bg'),c);cs.append(s)});
gc.onclick=async()=>{const c='NX-'+Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');await set(R('codes/'+c),{g:gid});cd.textContent=c};
const up=(k,z)=>{const f=E('input');f.type='file';f.accept='image/*';f.hidden=true;f.onchange=async()=>{if(f.files[0])set(R(gp+'/'+k),await shrink(f.files[0],z,.7))};const bt=E('button','b2',k=='pic'?'📷 Importer la photo du groupe':'🖼️ Importer un fond d’écran');bt.onclick=()=>f.click();return[f,bt]};
if(ad)b.append(E('h3',0,'Nom et photo (admin)'),n,p,sv,...up('pic',200),E('h3',0,'Fond du chat (admin)'),cs,...up('bg',900));
const dl=E('button','b2',ad?'🗑️ Supprimer le groupe':'🚪 Quitter le groupe');dl.onclick=async()=>{if(!confirm(ad?'Supprimer ce groupe pour tout le monde ? Irréversible.':'Quitter ce groupe ?'))return;const g=gid;
try{if(ad){await set(R('gmsg/'+g),null);await set(R('groups/'+g),null)}else await set(R(`groups/${g}/members/${me.uid}`),null);await set(R(`users/${me.uid}/groups/${g}`),null)}catch{return toast('Impossible, réessaie')}closeChat()};
b.append(...(ad||my=='o'?[E('h3',0,'Invitation'),gc,cd]:[]),E('h3',0,'Zone sensible'),dl,E('h3',0,'Membres'));
for(const u in G.members){const ro=G.members[u],r=E('div','rw'),s=E('span',0,(SYM[ro]||'')+' ');nm(u).then(x=>s.append(x));r.append(s);
if(ad&&u!=me.uid){const sel=E('select');[['o','🎖️ Officier'],['r','🧢 Recrue'],['m','Membre']].forEach(([v,t])=>{const o=E('option',0,t);o.value=v;o.selected=v==ro;sel.append(o)});sel.onchange=()=>set(R(`${gp}/members/${u}`),sel.value);r.append(sel)}
if(u!=me.uid&&(ad||(my=='o'&&(ro=='r'||ro=='m')))){const x=E('button','b2','Bannir');x.onclick=()=>update(ref(db),{[`${gp}/members/${u}`]:null,[`${gp}/bans/${u}`]:true});r.append(x)}
b.append(r)}
const bn=Object.keys(G.bans||{});if(bn.length){b.append(E('h3',0,'Bannis'));bn.forEach(u=>{const r=E('div','rw'),s=E('span');nm(u).then(x=>s.textContent=x);const x=E('button','b2','Débannir');x.onclick=()=>set(R(`${gp}/bans/${u}`),null);r.append(s,x);b.append(r)})}}
