const up=()=>{const ok=[...w].every(x=>f.has(x));s.textContent=[...w].map(x=>f.has(x)?x:'_').join(' ')+`   ❤️ ${6-h}`+(ok?'  🎉 Gagné':h>5?'  💀 '+w:'');k.querySelectorAll('button').forEach(x=>x.disabled=ok||h>5||f.has(x.textContent))},
go=()=>{w=L[Math.random()*L.length|0];f=new Set;h=0;up()};
for(const x of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){const b=E('button','kk',x);b.onclick=()=>{f.add(x);if(!w.includes(x))h++;up()};k.append(b)}
r.onclick=go;c.append(s,k,r);go()}
function quiz(c){c.replaceChildren();const Q=[['Capitale de la France ?',['Paris','Lyon','Nice'],0],['2 + 2 × 2 = ?',['8','6','4'],1],['Planète rouge ?',['Vénus','Mars','Jupiter'],1],['Jours dans une semaine ?',['5','6','7'],2],['Plus grand océan ?',['Atlantique','Pacifique','Indien'],1],['H2O, c\'est ?',['Du sel','De l\'eau','Du gaz'],1],['Côtés d\'un hexagone ?',['5','6','8'],1],['Langage des pages web ?',['HTML','Word','PDF'],0]].sort(()=>Math.random()-.5).slice(0,5);let i=0,sc=0;
const show=()=>{c.replaceChildren();if(i>=5){const b=E('button','b','Rejouer');b.onclick=()=>quiz(c);return c.append(E('h3',0,`Score : ${sc}/5`),b)}const[q,o,a]=Q[i];c.append(E('h3',0,`${i+1}/5  ${q}`));o.forEach((x,j)=>{const b=E('button','b2',x);b.onclick=()=>{if(j==a)sc++;i++;show()};c.append(b)})};show()}
function pfc(c){const s=E('p','e','Choisis !'),o=['🪨','📄','✂️'],r=E('div','gm');let a=0,b=0;o.forEach((x,i)=>{const d=E('div',0,x);d.style.cssText='font-size:34px;cursor:pointer';d.onclick=()=>{const j=Math.random()*3|0,w=(i-j+3)%3;w==1?a++:w==2&&b++;s.textContent=`${x} vs ${o[j]} : ${['Égalité','Gagné 🎉','Perdu 😈'][w]}   Toi ${a} - ${b} PC`};r.append(d)});c.append(s,r)}
const win4=(b,p)=>{for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[x,y]of[[0,1],[1,0],[1,1],[1,-1]]){let n=0;for(let i=0;i<4;i++){const a=r+x*i,d=c+y*i;if(a>5||d<0||d>6)break;if(b[a*7+d]==p)n++}if(n==4)return 1}return 0};
function duel(c,k,ttl){const[a,z]=k.slice(6).split('_'),op=a==me.uid?z:a,s=E('p','e','Chargement…'),g=E('div'),bar=E('div','add'),go=ty=>set(R(k),{g:ty,b:Array(ty=='m'?9:42).fill(0),t:op,p:[me.uid,op],w:0}),bt=(t,ty)=>{const b=E('button','b2',t);b.onclick=()=>go(ty);bar.append(b)};bt('Morpion ⚔️','m');bt('Puissance 4 ⚔️','p');
GU.push(onValue(R(k),sn=>{const st=sn.val();g.replaceChildren();if(!st){s.textContent='Lance une partie : '+ttl+' jouera en premier';return}
const pl=st.p[0]==me.uid?1:2,m4=st.g=='p';g.className=m4?'t4':'tt';
s.textContent=st.w?(st.w=='d'?'Égalité 🤝':st.w==me.uid?'Tu as gagné 🎉':'Tu as perdu 😈'):st.t==me.uid?'À toi de jouer ('+(m4?['🔴','🟡']:['X','O'])[pl-1]+')':'Au tour de '+ttl+'…';
st.b.forEach((v,i)=>{const x=E('button','sq2',(m4?['','🔴','🟡']:['','X','O'])[v]);x.onclick=()=>{if(st.w||st.t!=me.uid)return;const b=[...st.b];let q=i;if(m4){const cl=i%7;let r=5;while(r>=0&&b[r*7+cl])r--;if(r<0)return;q=r*7+cl}else if(b[i])return;b[q]=pl;update(R(k),{b,t:op,w:(m4?win4(b,pl):win(b,pl))?me.uid:b.includes(0)?0:'d'})};g.append(x)})},()=>{s.textContent='Mets à jour les règles Firebase (ligne games)'}));c.append(s,g,bar)}
// ---- Chat
const hm=t=>new Date(t).toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit'});
function add(v){const d=E('div','m'+(v.u==me.uid?' me':'')),r=G?.members?.[v.u];if(SYM[r])d.append(E('div','s',SYM[r]));d.append(E('div','n',v.n));if(v.i){const m=E('img');m.src=v.i;m.style.cssText='max-width:100%;border-radius:8px';d.append(m)}if(v.x)d.append(E('div',0,v.x));d.append(E('div','t',hm(v.t)));if(cur)localStorage['s'+cur.path]=v.t;const b=$('#ms');b.append(d);b.scrollTop=1e9}
function openChat(o){cur=o;gid=o.gid;delete UN[o.path];dots();G=null;ov('#ch');$('#ms').replaceChildren();$('#ms').style.background='';$('#cn').textContent=o.title;$('#gb').hidden=true;$('#gd').hidden=!!gid;
const go=()=>CU.push(onChildAdded(query(R(o.path),limitToLast(150)),s=>add(s.val())));
if(gid){let f=1;CU.push(onValue(R('groups/'+gid),s=>{G=s.val();if(!G)return closeChat();$('#cn').textContent=G.pic+' '+G.name;$('#ms').style.background=G.bg;const r=G.members?.[me.uid];$('#gb').hidden=!(r=='a'||r=='o');if(!$('#st').hidden)openSet();if(f){f=0;go()}},()=>closeChat()))}else go()}
function closeChat(){CU.forEach(f=>f());CU=[];$('#ch').hidden=true;$('#st').hidden=true;G=gid=null}
const ov=s=>{$(s).hidden=false;history.pushState(0,'')},closeG=()=>{GU.forEach(f=>f());GU=[];$('#gv').hidden=true};
addEventListener('popstate',()=>{if(!$('#gv').hidden)closeG();else if(!$('#st').hidden)$('#st').hidden=true;else if(!$('#ch').hidden)closeChat()});
$('#bk').onclick=$('#sx').onclick=$('#gx').onclick=()=>history.back();$('#gb').onclick=()=>{ov('#st');openSet()};
$('#gd').onclick=()=>{ov('#gv');$('#gt').textContent='Duel : '+cur.title;$('#gg').replaceChildren();duel($('#gg'),'games/'+cur.path.slice(4),cur.title)};$('#ph').onclick=()=>$('#pf').click();$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)push(R(cur.path),{u:me.uid,n:me.name,t:Date.now(),i:await shrink(f,800,.6)})};
$('#sf').onsubmit=e=>{e.preventDefault();const x=$('#si').value.trim();if(!x)return;$('#si').value='';push(R(cur.path),{u:me.uid,n:me.name,t:Date.now(),x})};
// ---- Paramètres du groupe
function openSet(){const my=G.members[me.uid],ad=my=='a',b=$('#sb'),gp='groups/'+gid;b.replaceChildren();$('#st').hidden=false;
const n=E('input'),p=E('input'),sv=E('button','b','Enregistrer'),cs=E('div','sw'),gc=E('button','b','Générer un code (1 utilisation)'),cd=E('div','cd');
n.value=G.name;p.value=G.pic;p.maxLength=4;p.placeholder='Emoji de la photo de groupe';
sv.onclick=()=>update(R(gp),{name:n.value.trim()||G.name,pic:p.value||'💬'});
['#000000','#1a0006','#001a0e','#00101f','#1a1200'].forEach(c=>{const s=E('button','sq');s.style.background=c;s.onclick=()=>set(R(gp+'/bg'),c);cs.append(s)});
gc.onclick=async()=>{const c='NX-'+Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');await set(R('codes/'+c),{g:gid});cd.textContent=c};
b.append(E('h3',0,'Nom et photo'),n,p,sv,E('h3',0,'Fond du chat'),cs,E('h3',0,'Invitation'),gc,cd,E('h3',0,'Membres'));
for(const u in G.members){const ro=G.members[u],r=E('div','rw'),s=E('span',0,(SYM[ro]||'')+' ');nm(u).then(x=>s.append(x));r.append(s);
if(ad&&u!=me.uid){const sel=E('select');[['o','🎖️ Officier'],['r','🧢 Recrue'],['m','Membre']].forEach(([v,t])=>{const o=E('option',0,t);o.value=v;o.selected=v==ro;sel.append(o)});sel.onchange=()=>set(R(`${gp}/members/${u}`),sel.value);r.append(sel)}
if(u!=me.uid&&(ad||(my=='o'&&(ro=='r'||ro=='m')))){const x=E('button','b2','Bannir');x.onclick=()=>update(ref(db),{[`${gp}/members/${u}`]:null,[`${gp}/bans/${u}`]:true});r.append(x)}
b.append(r)}
const bn=Object.keys(G.bans||{});if(bn.length){b.append(E('h3',0,'Bannis'));bn.forEach(u=>{const r=E('div','rw'),s=E('span');nm(u).then(x=>s.textContent=x);const x=E('button','b2','Débannir');x.onclick=()=>set(R(`${gp}/bans/${u}`),null);r.append(s,x);b.append(r)})}}
</script></body></html>
